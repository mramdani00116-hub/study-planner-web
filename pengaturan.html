<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Planner - Pengaturan</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body data-page="pengaturan">
    <div class="app">
      <aside class="sidebar">
        <div class="logo">
          <span>✎</span>
          Study Planner
        </div>

        <nav class="menu">
          <a href="index.html" class="menu-item">
            <span>▣</span>
            Dashboard
          </a>

          <a href="tugas.html" class="menu-item">
            <span>✓</span>
            Tugas
          </a>

          <a href="jadwal.html" class="menu-item">
            <span>▣</span>
            Jadwal
          </a>

          <a href="pengaturan.html" class="menu-item active">
            <span>⚙</span>
            Pengaturan
          </a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <h1>Pengaturan</h1>
            <p>Atur profil dan preferensi kamu.</p>
          </div>
        </header>

        <section class="settings-card">
          <h2>Informasi Profil</h2>

          <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="profile-name" placeholder="Nama kamu..." />
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" id="profile-email" placeholder="email@contoh.com" />
          </div>

          <div class="form-group">
            <label>Password Baru <span style="font-weight:400;color:#94a3b8">(opsional)</span></label>
            <input type="password" id="profile-password" placeholder="Biarkan kosong jika tidak ingin ganti" />
          </div>

          <button class="primary-button" onclick="saveSettings()">
            Simpan Perubahan
          </button>
        </section>

        <!-- Reset Data -->
        <section class="settings-card" style="margin-top:20px">
          <h2>Data Aplikasi</h2>
          <p style="font-size:13px;color:#64748b;margin-bottom:18px">
            Hapus semua tugas dan reset pengaturan ke default.
          </p>
          <button onclick="resetData()"
            style="background:#fef2f2;color:#dc2626;border:1px solid #fecaca;
                   padding:10px 18px;border-radius:7px;cursor:pointer;font-weight:600;">
            ⚠ Reset Semua Data
          </button>
        </section>
      </main>
    </div>

    <script src="js/script.js"></script>
    <script>
      function resetData() {
        if (!confirm("Yakin ingin menghapus semua data? Ini tidak bisa dibatalkan.")) return;
        localStorage.removeItem("sp_tasks");
        localStorage.removeItem("sp_profile");
        showToast("Semua data berhasil direset!");
        setTimeout(() => location.reload(), 1500);
      }
    </script>
  </body>
</html>
